<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">


<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout2}">
	
	<body>
		<div layout:fragment="content2" class="p-3">
			<h2 th:text="#{menu.admin.profesional}"></h2>
			
			<form id= createUserForm class="row g-3" th:object="${form}" th:action="@{/admin/users/save}" method="post">
				<div class="col-md-6">
				    <label for="inputDni" th:text="#{col.dni}" class="form-label"></label>
				    <input type="number" th:field="*{dni}" class="form-control" id="inputDni" placeholder="35765987">
				</div>
				<div class="col-md-6">
				    <label for="inputTelefono" th:text="#{col.telefono}" class="form-label"></label>
				    <input type="text" th:field="*{telefono}" class="form-control" id="inputTelefono" placeholder="223-5789654">
				</div>
				<div class="col-md-6">
				    <label for="inputNombre" th:text="#{col.nombre}" class="form-label"></label>
				    <input type="text" th:field="*{nombre}" class="form-control" id="inputNombre">
			  	</div>
				<div class="col-md-6">
				  	<label for="inputApellido" th:text="#{col.apellido}" class="form-label"></label>
				    <input type="text" th:field="*{apellido}" class="form-control" id="inputApellido">
				</div>
				<div class="col-md-6">
				    <label for="inputEmail4" th:text="#{col.email}" class="form-label"></label>
				    <input type="email" th:field="*{email}" class="form-control" id="inputEmail4">
			  	</div>
				<div class="col-md-6">
				  	<label for="inputPassword4" th:text="#{col.clave}"class="form-label"></label>
				    <input type="password" th:field="*{clave}" class="form-control" id="inputPassword4">
				</div>

				<div class="d-flex justify-content-start">
				<button id="saveBtn" class="btn btn-secondary" type="submit" th:text="#{save.btn}"></button>
				<button id="cancelBtn" class="btn btn-secondary ms-2"type="submit" th:text="#{cancel.btn}"></button>
				</div>
			</form>

		</div>
		
	</body>
</html>
