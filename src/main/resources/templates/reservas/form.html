<!DOCTYPE html>


<html xmlns="http://www.w3.org/1999/xhtml" 
	  xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
	  
	<body>
		<div layout:fragment="content">
	
			<div class="container">
		        <div class="header">
		            <div class="header-icon">💅</div>
		            <h1>BeautyTurn</h1>
		            <p>Completa el siguiente formulario para reservar tu turno</p>
		        </div>
		
		        <div class="form-container">
		            <form id="bookingForm" th:object="${form}" th:action="@{/reserva/save}" method="post">
		                <!-- Datos del Cliente -->
		                <h2 class="section-title">Tus datos</h2>
		                
		                <div class="form-group">
		                    <label for="dni" th:text="#{col.dni}"><span class="required">*</span></label>
		                    <input type="text"  th:field="*{dni}" id="dni" name="dni" placeholder="XXXXXXXX" maxlength="8" required>
		                    <div class="hint">Sin puntos ni guiones. Sólo números.</div>
		                </div>
		
		                <div class="form-row">
		                    <div class="form-group">
		                        <label for="nombre" th:text="#{col.nombre}"> <span class="required">*</span></label>
		                        <input type="text" th:field="*{nombre}" id="nombre" name="nombre" placeholder="María"  required>
		                    </div>
		
		                    <div class="form-group">
		                        <label for="apellido" th:text="#{col.apellido}"> <span class="required">*</span></label>
		                        <input type="text" th:field="*{apellido}" id="apellido" name="apellido" placeholder="González" required>
		                    </div>
		                </div>
		
		                <div class="form-row">
		                    <div class="form-group">
		                        <label for="telefono" th:text="#{col.telefono}"><span class="required">*</span></label>
		                        <input type="tel" th:field="*{telefono}" id="telefono" name="telefono" placeholder="1123456789" required>
		                        <div class="hint">Sin 0 ni 15. Ingrese sólo números.</div>
		                    </div>
		
		                    <div class="form-group">
		                        <label for="email" th:text="#{col.email}" >E-mail <span class="required">*</span></label>
		                        <input type="email" th:field="*{email}" id="email" name="email" placeholder="maria@gmail.com" required>
		                    </div>
		                </div>
		
		                <!-- Reserva -->
		                <h2 class="section-title" style="margin-top: 40px;">Reserva</h2>
						  <!-- 
		                <div class="form-group">
		                    <label for="servicio" th:text="#{menu.admin.servicios}"><span class="required">*</span></label>
		                    <select id="servicio" th:field="*{servicio}" name="servicio" required>
		                        <option value="">Seleccione tipo</option>
		                        <option th:each="serv : ${servicios}"
						                th:value="${serv.id}"
						                th:text="${serv.nombre}"
						                th:attr="data-duration=${serv.duracion}, data-price=${serv.precio}">
						        </option>
		                    </select>
		                    <div class="service-info" id="serviceInfo">
		                        <p><strong>Duración:</strong> <span id="serviceDuration"></span></p>
		                        <p><strong>Precio:</strong> <span id="servicePrice"></span></p>
		                    </div>
		                </div>
		
		                <div class="form-row-3">
		                    <div class="form-group">
		                        <label for="profesional" th:text="#{menu.admin.profesional}"><span class="required">*</span></label>
		                        <select id="profesional" th:field="*{profesional}" name="profesional" required>
		                            <option value="">Seleccione...</option>
		                            <option th:each="prof : ${profesional}"
						                    th:value="${prof.id}"
						                    th:text="${prof.nombre}">
						            </option>
		                       
		                        </select>
		                    </div> -->
		
		                    <div class="form-group">
		                        <label for="fecha">Fecha <span class="required">*</span></label>
		                        <input type="date" id="fecha" name="fecha" required>
		                    </div>
		
		                    <div class="form-group">
		                        <label for="hora">Hora <span class="required">*</span></label>
		                        <select id="hora" name="hora" required disabled>
		                            <option value="">Seleccione fecha</option>
		                        </select>
		                    </div>
		                </div>
		
		                <div id="successMessage" class="success-message">
		                    <h3>✅ ¡Turno reservado con éxito!</h3>
		                    <p style="margin-top: 10px;">Recibirás un email de confirmación en breve.</p>
		                    <p style="margin-top: 5px; font-weight: 600;">Número de confirmación: #<span id="confirmNumber"></span></p>
		                </div>
		
		                <button type="submit" class="btn-submit" th:text="#{reserva.btn}">
		                    <span>📅</span>
		                    <span></span>
		                </button>
		            </form>
		        </div>
		
		        <div class="footer">
		            Powered by BeautyTurn © 2025
		        </div>
		    </div>
		</div>
	</body>
</html>
